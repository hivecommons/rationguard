version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 (native compiler) breaks the current tsconfig/build.
      # Take TS majors deliberately via a migration PR, not Dependabot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
