name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Tarball excludes tests
        run: |
          if npm pack --dry-run --json | grep -q '"path": "dist/[^"]*\.test\.'; then
            echo "::error::npm tarball contains compiled test files; check the files field in package.json"
            exit 1
          fi

      - name: Coverage gate
        if: matrix.node-version == 24
        run: node --test --experimental-test-coverage --test-coverage-lines=99 --test-coverage-branches=95 --test-coverage-functions=100 dist/*.test.js

      - name: CLI smoke test
        run: |
          node dist/cli.js help
          node dist/cli.js check "all good here"

  changelog-guard:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Shipped code changes need a CHANGELOG entry
        run: |
          range="origin/${{ github.base_ref }}...HEAD"
          files=$(git diff --name-only "$range")
          shipped=$(echo "$files" | grep -E '^src/.*\.ts$' | grep -vE '\.test\.ts$|(^|/)(__tests__|test)/' || true)
          if git diff -U0 "$range" -- package.json | grep -E '^[+-]\s+"' | grep -qv '^+++\|^---' \
            && node -e 'const b=require("child_process").execSync("git show origin/${{ github.base_ref }}:package.json").toString();const h=require("./package.json");process.exit(JSON.stringify(JSON.parse(b).dependencies||{})===JSON.stringify(h.dependencies||{})?1:0)'; then
            shipped="$shipped package.json dependencies"
          fi
          if [ -n "${shipped// /}" ] && ! echo "$files" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Shipped code changed but CHANGELOG.md was not updated; add a line under '## Unreleased' or apply the 'skip-changelog' label"
            exit 1
          fi
