# Advisory mutation-testing report (#331). Report-only: the job never fails
# CI on mutation score (stryker thresholds.break is null) and is not a required
# check. Nightly runs mutate the whole tree; pull requests mutate only changed
# src files under a 20-minute budget. Ratchet is a separate, later decision.
name: Mutation (advisory)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore Stryker incremental results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-

      - name: Stryker (pull request, changed files only, 20 min budget)
        if: github.event_name == 'pull_request'
        timeout-minutes: 20
        continue-on-error: true
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'src/*.ts' 'src/**/*.ts' | grep -v '\.test\.ts$' | sort -u | paste -sd, -)
          if [ -z "$files" ]; then
            echo "No changed src files; skipping mutation run."
            exit 0
          fi
          npx stryker run --mutate "$files"

      - name: Stryker (nightly, full run, 5 h 30 min budget)
        if: github.event_name != 'pull_request'
        timeout-minutes: 330
        continue-on-error: true
        run: npx stryker run

      - name: Summary
        if: always()
        run: npm run --silent test:mutation:summary | tee mutation-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file mutation-summary.md --edit-last --create-if-none

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
