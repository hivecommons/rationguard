name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  verify-tag:
    name: Tag matches package.json version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare tag to package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}; bump package.json before tagging"
            exit 1
          fi

      - name: CHANGELOG has a section for this version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## $ver" 'index($0, h " ")==1 || $0==h {f=1; next} f && /^## /{exit} f' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${ver}' section; roll changelog.d/ fragments and bump before tagging"
            exit 1
          fi

  test:
    name: Test (${{ matrix.node-version }})
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Tarball excludes tests
        run: |
          if npm pack --dry-run --json | grep -q '"path": "dist/[^"]*\.test\.'; then
            echo "::error::npm tarball contains compiled test files; check the files field in package.json"
            exit 1
          fi

      - name: Coverage gate
        if: matrix.node-version == 24
        run: node --test --experimental-test-coverage --test-coverage-lines=99 --test-coverage-branches=94 --test-coverage-functions=97 dist/*.test.js

      - name: CLI smoke test
        run: |
          node dist/cli.js help
          node dist/cli.js check "all good here"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Dependency lifecycle scripts must not run in the job that holds the
      # OIDC token used for npm provenance.
      - run: npm ci --ignore-scripts

      - name: Publish package with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## $ver" 'index($0, h " ")==1 || $0==h {f=1; next} f && /^## /{exit} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it untouched"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
