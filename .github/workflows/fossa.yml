name: FOSSA license scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  fossa:
    name: FOSSA license scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Forks and repos without the secret skip the scan instead of failing
      # the check on a missing input; the scan activates once FOSSA_API_KEY is set.
      - name: Skip when FOSSA_API_KEY is not configured
        if: env.FOSSA_API_KEY == ''
        run: echo "FOSSA_API_KEY secret not set; skipping FOSSA scan." >> "$GITHUB_STEP_SUMMARY"

      # The key must be a push-only token from the *CNCF* FOSSA organization so
      # the project lands in the CNCF instance (cncf/sandbox#545). `team` takes
      # the team NAME, not the numeric id, and is honored only on the very first
      # upload that creates the project (fossa-cli docs/references/files/fossa-yml.md).
      # With `run-tests: true` the action runs ONLY `fossa test` (no analyze)
      # and forwards `team`/`branch` to it, which `fossa test` rejects. So:
      # always analyze (upload), then on PRs run the policy test separately.
      - name: Run FOSSA scan
        if: env.FOSSA_API_KEY != ''
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          project: hivecommons/rationguard
          team: Hive Commons
          branch: ${{ github.head_ref || github.ref_name }}

      # `fossa test --diff <base>` hard-fails when FOSSA has never seen the base
      # revision — the only uploader is this workflow's own push:main run, so a
      # main run lost to infrastructure (CLI download outage, #506) turns every
      # PR against that base red until main moves again. When FOSSA says the
      # base is unknown, test the PR revision in full instead (a superset of
      # the diff test); any other failure still fails the job.
      - name: Run FOSSA policy test
        if: env.FOSSA_API_KEY != '' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          if fossa test --project hivecommons/rationguard --diff "$BASE_SHA" 2>&1 | tee fossa-test.log; then
            exit 0
          fi
          if grep -q 'Revision for locator .* was not found' fossa-test.log; then
            echo "::warning::FOSSA has no analysis for base $BASE_SHA (its push:main scan did not upload); running the policy test on this revision without --diff."
            fossa test --project hivecommons/rationguard
          else
            exit 1
          fi
